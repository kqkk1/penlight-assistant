name: Build bookmarklet bundle

# extension フォルダのファイルが更新されたら、ブックマークレット用の content.js を自動生成する
on:
  push:
    branches: [main]
    paths:
      - "penlight-assistant/extension/**"
      - "penlight-assistant/tools/**"
      - "!penlight-assistant/extension/content.js"
  workflow_dispatch: # Actions画面から手動実行もできる

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build content.js
        run: node penlight-assistant/tools/build-bookmarklet.js penlight-assistant/extension penlight-assistant/extension/content.js

      - name: Commit content.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add penlight-assistant/extension/content.js
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "build: ブックマークレット用 content.js を自動生成"
            git push
          fi

      - name: Purge jsDelivr cache
        # jsDelivr はブランチ指定のファイルをしばらくキャッシュするので、更新をすぐ反映させる
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/penlight-assistant/extension/content.js" || true
